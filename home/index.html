<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYR Edition · Art, Culture and Beyond</title>
<meta name="description" content="SYR Edition — 예술로 소통하고 문화로 담아냅니다.">
<meta property="og:site_name" content="SYR Edition">
<meta property="og:title" content="SYR Edition · Art, Culture and Beyond">
<meta property="og:description" content="예술로 소통하고 문화로 담아냅니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://syredition.com/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400&family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════
   SYR EDITION — Home
   토큰 한 벌, 컨테이너 한 벌. About / Contact 페이지와 동일합니다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --c1:#1C1814;      /* ink */
  --c2:#6B7D6E;      /* sage */
  --c3:#F0EBE3;      /* stone */
  --br:#8C7355;      /* bronze */
  --white:#FFFFFF;
  --off:#FAFAF7;
  --line:#E2DCD3;
  --line-soft:#EFEAE3;
  --muted:#8A837B;

  --serif:'Cormorant Garamond','Noto Serif KR',Georgia,serif;
  --serif-kr:'Noto Serif KR','Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans','Noto Sans KR',system-ui,sans-serif;
  --mono:'DM Mono','DM Sans',monospace;

  /* 헤더·본문·푸터가 모두 이 값을 씁니다 — 좌우 정렬의 기준 */
  --page:1080px;
  --edge:clamp(22px, 5vw, 32px);
  --bar:60px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth; font-size:16px; -webkit-text-size-adjust:100%}
body{
  background:var(--off); color:var(--c1);
  font-family:var(--sans); font-weight:400; font-size:15px; line-height:1.75;
  word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}

.wrap{max-width:var(--page); margin:0 auto; padding:0 var(--edge); width:100%}

/* 언어 전환 */
.en{display:none}
html[data-lang="en"] .ko{display:none}
html[data-lang="en"] .en{display:inline}
html[data-lang="en"] .en.block{display:block}

/* ── 헤더 ─────────────────────────────────────────────────── */
.se-header{
  position:sticky; top:0; z-index:9000;
  background:rgba(250,250,247,.93);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.se-bar{
  max-width:var(--page); margin:0 auto; padding:0 var(--edge); height:var(--bar);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.se-brand{font-family:var(--serif); font-weight:500; font-size:20px;
  color:var(--c1); letter-spacing:.02em; line-height:1; white-space:nowrap}
.se-right{display:flex; align-items:center; gap:22px}
.se-nav ul{list-style:none; display:flex; align-items:center; gap:22px}
.se-nav a{font-size:13px; color:var(--muted); font-weight:500; line-height:1;
  padding:6px 0; border-bottom:1px solid transparent;
  transition:color .2s, border-color .2s}
.se-nav a:hover{color:var(--c1)}
.se-nav a.cur{color:var(--c1); border-bottom-color:var(--c2)}
.se-lang{border:1px solid var(--line); background:none; cursor:pointer;
  font-family:var(--sans); font-size:11px; font-weight:600; color:var(--c1);
  padding:7px 11px; border-radius:1px; letter-spacing:.06em; line-height:1;
  transition:border-color .2s, color .2s}
.se-lang:hover{border-color:var(--c2); color:var(--c2)}

/* 햄버거 — 모바일 탭 영역 44px 확보 */
.se-burger{display:none; background:none; border:0; cursor:pointer;
  width:44px; height:44px; margin-right:-10px; padding:11px 10px}
.se-burger span{display:block; height:1px; background:var(--c1); margin:5.5px 0;
  transition:transform .25s, opacity .25s}
.se-header.open .se-burger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.se-header.open .se-burger span:nth-child(2){opacity:0}
.se-header.open .se-burger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

@media(max-width:860px){
  .se-burger{display:block; order:2}
  .se-right{gap:10px}
  .se-nav{position:absolute; left:0; right:0; top:var(--bar); display:none;
    background:var(--off); border-bottom:1px solid var(--line);
    max-height:calc(100dvh - var(--bar)); overflow-y:auto}
  .se-header.open .se-nav{display:block}
  .se-nav ul{flex-direction:column; align-items:stretch; gap:0;
    max-width:var(--page); margin:0 auto; padding:4px var(--edge) 14px}
  .se-nav li{border-top:1px solid var(--line-soft)}
  .se-nav a{display:block; padding:14px 0; border-bottom:0; font-size:15px}
}

/* ── 화면 단위 섹션 ───────────────────────────────────────── */
/* 100vh 대신 100svh : 모바일 주소창이 접힐 때 화면이 튀지 않습니다 */
.screen{
  background:var(--c1); position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
  min-height:calc(100vh - var(--bar));
  min-height:calc(100svh - var(--bar));
  padding:clamp(3.5rem,10vw,6.5rem) 0 clamp(2rem,5vw,3rem);
}
.screen + .screen{border-top:1px solid rgba(255,255,255,.1)}
.screen::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size:48px 48px;
}
.screen .wrap{position:relative; z-index:1}
.screen-foot{position:relative; z-index:1; margin-top:clamp(2.5rem,6vw,4rem)}

/* ── 표지 ─────────────────────────────────────────────────── */
.cover-syr{
  font-family:var(--serif); font-weight:300; color:var(--white);
  font-size:clamp(3.6rem,17vw,8.5rem); line-height:.9; letter-spacing:-.02em;
}
.cover-sub{
  font-family:var(--mono); font-size:clamp(.6rem,2.6vw,.68rem);
  letter-spacing:.18em; text-transform:uppercase; color:var(--c2);
  margin-top:1.2rem;
}

/* ── 마무리 ───────────────────────────────────────────────── */
.closing-headline{
  font-family:var(--serif-kr); font-weight:300; color:var(--white);
  font-size:clamp(1.9rem,6.5vw,4.4rem); line-height:1.3; letter-spacing:-.01em;
  max-width:18ch;
}
.closing-sub{
  font-family:var(--mono); font-size:clamp(.62rem,2.6vw,.72rem);
  letter-spacing:.1em; color:var(--c2); margin-top:1.4rem;
}
.closing-footer{
  border-top:1px solid rgba(255,255,255,.1); padding-top:1.3rem;
  font-family:var(--mono); font-size:.6rem; letter-spacing:.08em;
  color:rgba(255,255,255,.35);
}

/* ── 스크롤 힌트 : 데스크톱에서만 ─────────────────────────── */
.scroll-hint{
  position:fixed; bottom:2rem; right:2.5rem; z-index:100;
  display:flex; flex-direction:column; align-items:center; gap:.4rem;
  transition:opacity .4s;
}
.scroll-hint.hidden{opacity:0; pointer-events:none}
.scroll-hint span{font-family:var(--mono); font-size:.52rem; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); writing-mode:vertical-rl}
.scroll-arrow{width:1px; height:40px;
  background:linear-gradient(to bottom, rgba(255,255,255,.35), transparent);
  animation:scrollPulse 1.8s ease-in-out infinite}
@keyframes scrollPulse{
  0%,100%{transform:scaleY(1); opacity:.6}
  50%{transform:scaleY(.6); opacity:1}
}
@media(max-width:860px){ .scroll-hint{display:none} }

/* ── 푸터 ─────────────────────────────────────────────────── */
.se-footer{padding:26px 0; border-top:1px solid var(--line); background:var(--off)}
.se-foot-in{
  max-width:var(--page); margin:0 auto; padding:0 var(--edge);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  font-size:12.5px; color:var(--muted);
}
.se-foot-in a{border-bottom:1px solid var(--line);
  transition:color .2s, border-color .2s}
.se-foot-in a:hover{color:var(--c1); border-bottom-color:var(--c2)}

:focus-visible{outline:2px solid var(--c2); outline-offset:3px}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto}
}
</style>
</head>
<body>

<script>function toggleLang(){var h=document.documentElement,n=h.getAttribute("data-lang")==="en"?"ko":"en";h.setAttribute("data-lang",n);h.setAttribute("lang",n);}</script>

<header class="se-header" id="seHeader">
  <div class="se-bar">
    <a class="se-brand" href="/">SYR Edition</a>
    <button class="se-burger" id="seBurger" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="se-right">
      <nav class="se-nav" aria-label="Primary">
        <ul>
          <li><a href="/home" class="cur">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/news">News</a></li>
          <li><a href="/briefing">Briefing</a></li>
          <li><a href="/book">Book</a></li>
          <li><a href="/case">Case</a></li>
          <li><a href="/artist">Artist</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
      <button class="se-lang" id="seLang" type="button" aria-label="Language">EN</button>
    </div>
  </div>
</header>

<div class="scroll-hint" id="scrollHint">
  <span>Scroll</span>
  <div class="scroll-arrow"></div>
</div>

<!-- ══ 표지 ════════════════════════════════════════════════════ -->
<section id="s01" class="screen">
  <div class="wrap">
    <div class="cover-syr">SYR</div>
    <p class="cover-sub">Stay Curious, Stay Strategic</p>
  </div>
  <div class="wrap screen-foot"></div>
</section>

<!-- ══ 마무리 ══════════════════════════════════════════════════ -->
<section id="s12" class="screen">
  <div class="wrap">
    <h1 class="closing-headline">
      <span class="ko">예술로 소통하고<br>문화로 담아냅니다.</span>
      <span class="en">Communicating through art,<br>embracing through culture.</span>
    </h1>
    <p class="closing-sub">Art, Culture and Beyond</p>
  </div>
</section>

<footer class="se-footer">
  <div class="se-foot-in">
    <div>© SYR Edition. All copyrights reserved.
  </div>
</footer>

<script>
(function(){
  var h = document.getElementById('seHeader');
  var b = document.getElementById('seBurger');
  var l = document.getElementById('seLang');
  var hint = document.getElementById('scrollHint');

  /* 모바일 메뉴 */
  if (b && h) {
    b.addEventListener('click', function(){
      var open = h.classList.toggle('open');
      b.setAttribute('aria-expanded', String(open));
    });
    h.querySelectorAll('.se-nav a').forEach(function(a){
      a.addEventListener('click', function(){
        h.classList.remove('open');
        b.setAttribute('aria-expanded','false');
      });
    });
  }

  /* 언어 버튼 */
  function cur(){ return document.documentElement.getAttribute('data-lang') || 'ko'; }
  if (l) {
    l.textContent = cur() === 'en' ? 'KOR' : 'EN';
    l.addEventListener('click', function(){
      toggleLang();
      l.textContent = cur() === 'en' ? 'KOR' : 'EN';
    });
  }

  /* 스크롤 힌트 : 첫 스크롤 후 숨김 */
  if (hint) {
    window.addEventListener('scroll', function(){
      if (window.scrollY > 120) hint.classList.add('hidden');
    }, { once:true, passive:true });
  }
})();
</script>
</body>
</html>
