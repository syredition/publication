<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYR Edition - Inquiry</title>
<meta name="description" content="Art Culture and Beyond">

<!-- 링크 공유 미리보기 -->
<meta property="og:site_name" content="SYR Edition">
<meta property="og:title" content="Inquiry">
<meta property="og:description" content="Art Culture and Beyond">
<meta property="og:type" content="website">
<meta property="og:url" content="https://syredition.com/">
<!-- TODO: 1200×630 이미지를 만들어 두 줄의 주석을 해제하십시오
<meta property="og:image" content="https://syredition.com/assets/og.png">
<meta name="twitter:card" content="summary_large_image"> -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ══ 토큰 ═══════════════════════════════════════════════════
     색을 되돌리거나 바꾸려면 이 블록만 고치면 전체에 반영됩니다.
     ══════════════════════════════════════════════════════════ */
  :root{
    --ink:#1C1814;        /* 제목 · 본문 */
    --sage:#6B7D6E;       /* 강조 · 선 · 버튼 */
    --sage-deep:#586A5B;  /* 강조 호버 */
    --bronze:#8C7355;     /* 라벨 · 번호 */
    --muted:#8A837B;      /* 보조 텍스트 */
    --rule:#E2DCD3;       /* 실선 */
    --rule-soft:#EFEAE3;
    --bg:#FAFAF7;         /* 배경 */
    --stone:#F0EBE3;      /* 교차 배경 */
    --maxw:1080px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg); color:var(--ink);
    font-family:'DM Sans','Noto Sans KR',system-ui,sans-serif;
    font-size:15px; font-weight:400; line-height:1.7; letter-spacing:-.003em;
    -webkit-font-smoothing:antialiased; word-break:keep-all;}
  .serif{font-family:'Cormorant Garamond','Noto Serif KR',Georgia,serif}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px}
  a{color:inherit; text-decoration:none}
  h1,h2,h3{font-family:'Cormorant Garamond','Noto Serif KR',Georgia,serif;
    font-weight:500; color:var(--ink); line-height:1.18; letter-spacing:-.008em}

  /* 언어 전환 : <html data-lang> 하나로 제어 */
  .en{display:none}
  html[data-lang="en"] .ko{display:none}
  html[data-lang="en"] .en{display:inline}
  html[data-lang="en"] .en.block{display:block}

  .eyebrow{font-family:'DM Sans','Noto Sans KR',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--bronze)}

  /* ── HEADER ─────────────────────────────────────────────── */
  header{position:sticky; top:0; z-index:50; background:rgba(250,250,247,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--rule)}
  .navbar{display:flex; align-items:center; justify-content:space-between; gap:24px; height:60px}

  .brand{font-family:'Cormorant Garamond','Noto Serif KR',serif; font-weight:600; font-size:20px;
    color:var(--ink); letter-spacing:.02em; line-height:1; white-space:nowrap; flex:0 0 auto}

  .nav-right{display:flex; align-items:center; gap:22px}

  nav.links ul{list-style:none; display:flex; align-items:center; gap:22px}
  nav.links a{font-size:13px; color:var(--muted); font-weight:500; line-height:1;
    padding:6px 0; border-bottom:1px solid transparent; transition:color .2s, border-color .2s}
  nav.links a:hover{color:var(--ink)}
  nav.links a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--sage)}

  .lang{border:1px solid var(--rule); background:none; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:11px; font-weight:600; color:var(--ink);
    padding:6px 11px; border-radius:1px; letter-spacing:.06em; line-height:1; flex:0 0 auto;
    transition:border-color .2s, color .2s}
  .lang:hover{border-color:var(--sage); color:var(--sage)}

  /* 모바일 메뉴 버튼 */
  .burger{display:none; background:none; border:0; cursor:pointer; padding:6px; width:34px; height:34px}
  .burger span{display:block; height:1px; background:var(--ink); margin:6px 0; transition:transform .25s, opacity .25s}
  header.is-open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  header.is-open .burger span:nth-child(2){opacity:0}
  header.is-open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  @media(max-width:820px){
    .burger{display:block}
    .nav-right{gap:12px}
    nav.links{position:absolute; left:0; right:0; top:60px; display:none;
      background:var(--bg); border-bottom:1px solid var(--rule)}
    header.is-open nav.links{display:block}
    nav.links ul{flex-direction:column; align-items:stretch; gap:0;
      max-width:var(--maxw); margin:0 auto; padding:4px 32px 16px}
    nav.links li{border-top:1px solid var(--rule-soft)}
    nav.links a{display:block; padding:14px 0; border-bottom:0; font-size:15px}
    nav.links a[aria-current="page"]{color:var(--ink)}
  }

  /* ── HERO ───────────────────────────────────────────────── */
  .hero{position:relative; overflow:hidden; border-bottom:1px solid var(--rule)}
  .hero-inner{display:grid; grid-template-columns:1.35fr 1fr; gap:40px; align-items:center;
    padding:84px 0 76px}
  .hero .eyebrow{margin-bottom:24px; display:block}
  .hero h1{font-size:clamp(31px,4.4vw,50px); max-width:16ch; margin-bottom:22px; font-weight:500}
  .hero-syr{font-family:'Cormorant Garamond',serif; font-size:clamp(3.4rem,9vw,6.2rem);
    font-weight:300; color:var(--ink); line-height:.92; letter-spacing:-.02em; margin-bottom:14px}
  .hero-tagline{font-family:'DM Mono','DM Sans',monospace; font-size:.66rem;
    letter-spacing:.2em; text-transform:uppercase; color:var(--sage); margin-bottom:30px}
  .hero .lead{font-family:'DM Sans','Noto Sans KR',sans-serif; font-size:clamp(14.5px,1.4vw,16px);
    color:var(--muted); max-width:48ch; margin-bottom:30px; line-height:1.75}
  .cta-row{display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  .btn{display:inline-block; font-family:'DM Sans','Noto Sans KR',sans-serif; font-weight:600;
    font-size:13.5px; padding:11px 22px; border-radius:1px; cursor:pointer; letter-spacing:.01em}
  .btn-primary{background:var(--ink); color:var(--bg); border:1px solid var(--ink);
    transition:background .2s, border-color .2s}
  .btn-primary:hover{background:var(--sage); border-color:var(--sage)}
  .btn-ghost{border:1px solid var(--rule); color:var(--ink); transition:border-color .2s, color .2s}
  .btn-ghost:hover{border-color:var(--sage); color:var(--sage)}

  /* 기하 구성 */
  .geo{position:relative; height:300px}
  .geo .ring{position:absolute; border-radius:50%; border:1px solid var(--sage)}
  .geo .r1{width:264px; height:264px; top:18px; right:0; opacity:.85}
  .geo .r2{width:186px; height:186px; top:57px; right:39px; border-color:var(--rule)}
  .geo .disc{position:absolute; width:132px; height:132px; border-radius:50%;
    background:var(--stone); top:84px; right:66px}
  .geo .half{position:absolute; width:132px; height:66px; top:150px; right:66px;
    background:var(--sage); border-radius:0 0 132px 132px}
  .geo .dot{position:absolute; width:10px; height:10px; border-radius:50%; background:var(--bronze);
    top:18px; right:259px}
  @media(max-width:820px){ .hero-inner{grid-template-columns:1fr; padding:64px 0 60px} .geo{display:none} }

  /* ── SECTION ────────────────────────────────────────────── */
  section{padding:68px 0}
  .stone{background:var(--stone)}
  /* 인접한 섹션 사이에만 선을 둡니다 (선이 두 번 겹치던 문제) */
  section + section{border-top:1px solid var(--rule)}
  .sec-label{font-family:'DM Sans','Noto Sans KR',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--bronze); margin-bottom:14px}
  h2{font-size:clamp(22px,2.9vw,31px); max-width:24ch; margin-bottom:16px; font-weight:500}
  .sec-intro{font-family:'DM Sans','Noto Sans KR',sans-serif; color:var(--muted); font-size:15px;
    max-width:62ch; line-height:1.75}

  /* ── SERVICES ───────────────────────────────────────────── */
  .svc-grid{display:grid; grid-template-columns:1fr 1fr; gap:0; margin-top:26px; border-top:1px solid var(--rule)}
  @media(max-width:720px){ .svc-grid{grid-template-columns:1fr} }
  .svc{padding:28px 30px 28px 0; border-bottom:1px solid var(--rule)}
  .svc:nth-child(even){padding-left:38px; border-left:1px solid var(--rule)}
  @media(max-width:720px){ .svc:nth-child(even){padding-left:0; border-left:none} }
  .svc .num{font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--bronze); line-height:1}
  .svc h3{font-size:20px; margin:6px 0 8px; font-weight:500}
  .svc p{font-family:'DM Sans','Noto Sans KR',sans-serif; color:var(--muted); font-size:14px; line-height:1.7}
  .svc .for{display:block; margin-top:12px; font-size:12px; color:var(--sage); letter-spacing:.02em}

  /* ── CLIENTS ────────────────────────────────────────────── */
  .cli-head{margin-top:38px; margin-bottom:2px}
  .cli-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px; margin-top:18px}
  @media(max-width:860px){ .cli-grid{grid-template-columns:1fr 1fr} }
  @media(max-width:480px){ .cli-grid{grid-template-columns:1fr} }
  .cli{border-top:1px solid var(--sage); padding-top:14px}
  .cli h3{font-size:17px; margin-bottom:6px; font-weight:500}
  .cli p{font-family:'DM Sans','Noto Sans KR',sans-serif; color:var(--muted); font-size:13px; line-height:1.65}

  /* ── CONTACT ────────────────────────────────────────────── */
  .contact{position:relative; overflow:hidden}
  .contact .mail{font-family:'Cormorant Garamond','Noto Serif KR',serif; font-size:clamp(23px,3.4vw,34px);
    font-weight:500; color:var(--ink); border-bottom:1px solid var(--sage); padding-bottom:3px;
    display:inline-block; line-height:1.25; transition:color .2s}
  .contact .mail:hover{color:var(--sage)}
  .cinfo{display:flex; gap:38px; flex-wrap:wrap; margin-top:28px;
    font-family:'DM Sans','Noto Sans KR',sans-serif; color:var(--ink); font-size:14px}
  .cinfo b{display:block; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--bronze); margin-bottom:5px; font-weight:600}
  .contact .corner{position:absolute; right:-70px; bottom:-70px; width:220px; height:220px;
    border-radius:50%; border:1px solid var(--rule); pointer-events:none}
  .contact .corner2{position:absolute; right:10px; bottom:10px; width:80px; height:80px;
    border-radius:50%; background:var(--stone); pointer-events:none; z-index:-1}

  /* 문의 폼 */
  .contact-grid{display:grid; grid-template-columns:1fr 1.25fr; gap:48px; align-items:start;
    margin-top:40px; padding-top:34px; border-top:1px solid var(--rule)}
  @media(max-width:820px){ .contact-grid{grid-template-columns:1fr; gap:34px} }

  .cform{display:grid; grid-template-columns:1fr 1fr; gap:20px 20px; position:relative; z-index:2}
  @media(max-width:560px){ .cform{grid-template-columns:1fr} }
  .cfield{display:flex; flex-direction:column}
  .cfield.wide{grid-column:1 / -1}
  .cfield label{font-family:'DM Sans','Noto Sans KR',sans-serif; font-size:10.5px; font-weight:600;
    letter-spacing:.13em; text-transform:uppercase; color:var(--bronze); margin-bottom:7px}
  .cfield input, .cfield select, .cfield textarea{
    font-family:'DM Sans','Noto Sans KR',sans-serif; font-size:14px; color:var(--ink);
    background:transparent; border:0; border-bottom:1px solid var(--rule);
    padding:8px 0; border-radius:0; transition:border-color .2s}
  .cfield textarea{resize:vertical; min-height:108px; line-height:1.7}
  .cfield select{appearance:none; cursor:pointer; padding-right:22px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                     linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 9px) calc(50% + 1px), calc(100% - 4px) calc(50% + 1px);
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat}
  .cfield input:focus, .cfield select:focus, .cfield textarea:focus{
    outline:0; border-bottom-color:var(--sage)}
  .cfield input::placeholder, .cfield textarea::placeholder{color:#B9BCC4}

  .cactions{grid-column:1 / -1; display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-top:6px}
  .cstatus{font-family:'DM Sans','Noto Sans KR',sans-serif; font-size:13px; color:var(--muted)}
  .cstatus.ok{color:var(--sage)}
  .cstatus.bad{color:#C0392B}
  .ctrap{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

  footer{padding:28px 0; border-top:1px solid var(--rule); background:var(--bg)}
  .foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
    font-family:'DM Sans','Noto Sans KR',sans-serif; color:var(--muted); font-size:12.5px}

  :focus-visible{outline:2px solid var(--sage); outline-offset:3px}
  @media(prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto} }
</style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════════ -->
<header id="siteHeader">
  <div class="wrap navbar">
    <a class="brand" href="/">SYR Edition</a>

    <button class="burger" type="button" id="burger" aria-label="메뉴" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-right">
      <nav class="links" aria-label="주요 메뉴">
        <ul>
          <li><a href="/home">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/news">News</a></li>
          <li><a href="/briefing">Briefing</a></li>
          <li><a href="/book">Book</a></li>
          <li><a href="/case">Case</a></li>
          <li><a href="/artist">Artist</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
      <button class="lang" type="button" onclick="toggleLang()" aria-label="Toggle language">
        <span class="ko">EN</span><span class="en">KOR</span>
      </button>
    </div>
  </div>
</header>

<!-- ══ HERO ════════════════════════════════════════════════════ -->

<script>
/* ── 언어 전환 ─────────────────────────────────────────────── */
function toggleLang(){
  var html = document.documentElement;
  var next = html.getAttribute('data-lang') === 'en' ? 'ko' : 'en';
  html.setAttribute('data-lang', next);
  html.setAttribute('lang', next);
}

/* ── 모바일 메뉴 ───────────────────────────────────────────── */
(function(){
  var header = document.getElementById('siteHeader');
  var burger = document.getElementById('burger');
  burger.addEventListener('click', function(){
    var open = header.classList.toggle('is-open');
    burger.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('nav.links a').forEach(function(a){
    a.addEventListener('click', function(){
      header.classList.remove('is-open');
      burger.setAttribute('aria-expanded','false');
    });
  });
})();

/* ── 문의 폼 ───────────────────────────────────────────────────
   설정은 아래 두 줄뿐입니다.

   TO       : 받는 주소
   ENDPOINT : Formspree 주소. 비워두면 메일 앱이 열리는 방식으로
              자동 전환되어 지금 상태로도 바로 동작합니다.
              formspree.io 가입 → New Form → 받은 주소를 붙여넣기
   ──────────────────────────────────────────────────────────── */
(function(){
  var TO = 'info@syr.co.kr';
  var ENDPOINT = '';   // 예: 'https://formspree.io/f/xxxxxxxx'

  var form   = document.getElementById('cform');
  var status = document.getElementById('cstatus');
  var button = document.getElementById('csend');

  function isKo(){ return document.documentElement.getAttribute('data-lang') !== 'en'; }
  function say(ko, en, cls){
    status.textContent = isKo() ? ko : en;
    status.className = 'cstatus' + (cls ? ' ' + cls : '');
  }
  function label(sel){ return sel.options[sel.selectedIndex].text; }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (form.website.value) return;                 // 봇 차단

    var name = form.name.value.trim();
    var email = form.email.value.trim();
    var message = form.message.value.trim();

    if (!name || !email || !message){
      say('이름, 이메일, 내용을 채워주세요.',
          'Please fill in your name, email and message.', 'bad');
      return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      say('이메일 주소를 다시 확인해주세요.',
          'That email address does not look right.', 'bad');
      return;
    }

    var typeLabel = label(form.type);
    var whoLabel  = label(form.who);

    /* Formspree 미설정 → 메일 앱으로 전환 */
    if (!ENDPOINT){
      var subject = '[SYR Edition] ' + typeLabel + ' — ' + name;
      var lines =
        '이름 / Name: ' + name + '\n' +
        '소속 / Organisation: ' + (form.org.value.trim() || '-') + '\n' +
        '이메일 / Email: ' + email + '\n' +
        '소속 유형 / Segment: ' + whoLabel + '\n' +
        '문의 유형 / Type: ' + typeLabel + '\n\n' +
        '내용 / Message:\n' + message + '\n';
      window.location.href = 'mailto:' + TO +
        '?subject=' + encodeURIComponent(subject) +
        '&body='    + encodeURIComponent(lines);
      say('메일 앱이 열립니다. 창에서 전송을 눌러주세요.',
          'Your mail app is opening. Press send there to finish.', 'ok');
      return;
    }

    /* Formspree 설정됨 → 페이지 이동 없이 전송 */
    button.disabled = true;
    say('보내는 중…', 'Sending…');

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    }).then(function(res){
      if (!res.ok) throw new Error('failed');
      form.reset();
      say('보내주셔서 감사합니다. 곧 회신드리겠습니다.',
          'Thank you. We will reply within two business days.', 'ok');
    }).catch(function(){
      say('시스템 업데이트 중입니다. info@syr.co.kr 로 직접 보내주시면 곧 회신드리겠습니다 :) ',
          'Something went wrong. Please email info@syr.co.kr directly.', 'bad');
    }).then(function(){
      button.disabled = false;
    });
  });
})();
</script>
</body>
</html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ══════════════════════════════════════════════════════════════
   SYR EDITION — Contact
   토큰과 헤더·푸터는 About 페이지와 동일합니다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#1C1814; --sage:#6B7D6E; --bronze:#8C7355; --muted:#8A837B;
  --rule:#E2DCD3; --rule-soft:#EFEAE3; --bg:#FAFAF7; --stone:#F0EBE3; --white:#FFFFFF;
  --serif:'Cormorant Garamond','Noto Serif KR',Georgia,serif;
  --serif-kr:'Noto Serif KR','Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans','Noto Sans KR',system-ui,sans-serif;
  --mono:'DM Mono','DM Sans',monospace;
  --page:1080px; --edge:32px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.75; letter-spacing:-.003em;
  word-break:keep-all; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh}
a{color:inherit;text-decoration:none}
main{flex:1}
.wrap{max-width:var(--page); margin:0 auto; padding:0 var(--edge)}

/* ── 헤더 ─────────────────────────────────────────────────── */
.se-header{position:sticky; top:0; z-index:9000; background:rgba(250,250,247,.92);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule)}
.se-bar{max-width:var(--page); margin:0 auto; padding:0 var(--edge); height:60px;
  display:flex; align-items:center; justify-content:space-between; gap:24px}
.se-brand{font-family:var(--serif); font-weight:500; font-size:20px; color:var(--ink);
  letter-spacing:.02em; line-height:1; white-space:nowrap}
.se-right{display:flex; align-items:center; gap:22px}
.se-nav ul{list-style:none; display:flex; align-items:center; gap:22px}
.se-nav a{font-size:13px; color:var(--muted); font-weight:500; line-height:1;
  padding:6px 0; border-bottom:1px solid transparent; transition:color .2s, border-color .2s}
.se-nav a:hover{color:var(--ink)}
.se-nav a.cur{color:var(--ink); border-bottom-color:var(--sage)}
.se-lang{border:1px solid var(--rule); background:none; cursor:pointer; font-family:var(--sans);
  font-size:11px; font-weight:600; color:var(--ink); padding:6px 11px; border-radius:1px;
  letter-spacing:.06em; line-height:1; transition:border-color .2s, color .2s}
.se-lang:hover{border-color:var(--sage); color:var(--sage)}
.se-burger{display:none; background:none; border:0; cursor:pointer; padding:6px; width:32px; height:32px}
.se-burger span{display:block; height:1px; background:var(--ink); margin:5.5px 0;
  transition:transform .25s, opacity .25s}
.se-header.open .se-burger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.se-header.open .se-burger span:nth-child(2){opacity:0}
.se-header.open .se-burger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
@media(max-width:860px){
  .se-burger{display:block}
  .se-right{gap:12px}
  .se-nav{position:absolute; left:0; right:0; top:60px; display:none;
    background:var(--bg); border-bottom:1px solid var(--rule)}
  .se-header.open .se-nav{display:block}
  .se-nav ul{flex-direction:column; align-items:stretch; gap:0;
    max-width:var(--page); margin:0 auto; padding:4px var(--edge) 14px}
  .se-nav li{border-top:1px solid var(--rule-soft)}
  .se-nav a{display:block; padding:13px 0; border-bottom:0; font-size:14px}
}

/* ── 문의 ─────────────────────────────────────────────────── */
section{padding:clamp(3.5rem,8vw,6rem) 0}
.stag{font-family:var(--mono); font-size:.58rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--bronze); display:block; margin-bottom:1rem}
h1{font-family:var(--serif-kr); font-size:clamp(1.35rem,2.6vw,1.9rem);
  font-weight:400; color:var(--ink); line-height:1.3; letter-spacing:-.01em}

.contact-grid{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,7fr);
  gap:clamp(2.2rem,5vw,4rem); align-items:start;
  margin-top:clamp(2rem,4vw,2.8rem); padding-top:clamp(1.8rem,4vw,2.4rem);
  border-top:1px solid var(--rule)}
@media(max-width:820px){ .contact-grid{grid-template-columns:1fr; gap:2.2rem} }

.meta{font-size:.85rem; color:var(--muted); line-height:1.9}
.meta b{display:block; font-family:var(--mono); font-size:.55rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--bronze); font-weight:400; margin:1.2rem 0 .2rem}
.meta b:first-child{margin-top:0}
.meta a{color:var(--ink); border-bottom:1px solid var(--sage); padding-bottom:1px}

/* 폼 — 박스 없이 밑줄만 */
.cform{display:grid; grid-template-columns:1fr 1fr; gap:20px; position:relative}
@media(max-width:560px){ .cform{grid-template-columns:1fr} }
.cfield{display:flex; flex-direction:column}
.cfield.wide{grid-column:1 / -1}
.cfield label{font-family:var(--mono); font-size:.55rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--bronze); margin-bottom:7px}
.cfield input,.cfield select,.cfield textarea{
  font-family:var(--sans); font-size:14px; color:var(--ink); background:transparent;
  border:0; border-bottom:1px solid var(--rule); padding:8px 0; border-radius:0;
  transition:border-color .2s}
.cfield textarea{resize:vertical; min-height:108px; line-height:1.7}
.cfield select{appearance:none; cursor:pointer; padding-right:20px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 8px) calc(50% + 1px), calc(100% - 4px) calc(50% + 1px);
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat}
.cfield input:focus,.cfield select:focus,.cfield textarea:focus{
  outline:0; border-bottom-color:var(--sage)}
.cfield input::placeholder,.cfield textarea::placeholder{color:#C4BDB4}

.cactions{grid-column:1 / -1; display:flex; align-items:center; gap:18px;
  flex-wrap:wrap; margin-top:4px}
.send{font-family:var(--sans); font-size:13.5px; font-weight:600; letter-spacing:.02em;
  cursor:pointer; padding:11px 26px; border:1px solid var(--ink);
  background:var(--ink); color:var(--bg); border-radius:1px;
  transition:background .2s, border-color .2s}
.send:hover{background:var(--sage); border-color:var(--sage)}
.send[disabled]{opacity:.5; cursor:default}
.cstatus{font-size:13px; color:var(--muted)}
.cstatus.ok{color:var(--sage)}
.cstatus.bad{color:#B4553F}
.ctrap{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

/* ── 푸터 ─────────────────────────────────────────────────── */
.se-footer{padding:26px 0; border-top:1px solid var(--rule); background:var(--bg)}
.se-foot-in{max-width:var(--page); margin:0 auto; padding:0 var(--edge);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  font-size:12.5px; color:var(--muted)}
.se-foot-in a{border-bottom:1px solid var(--rule); transition:color .2s, border-color .2s}
.se-foot-in a:hover{color:var(--ink); border-bottom-color:var(--sage)}

:focus-visible{outline:2px solid var(--sage); outline-offset:3px}
@media(prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto} }
</style>
</head>
<body>


<main>
<section>
  <div class="wrap">
    <span class="stag">Contact</span>
    <h1>문의</h1>

    <div class="contact-grid">
      <div class="meta">
        <b>Email</b>
        <a href="mailto:info@syr.co.kr">info@syr.co.kr</a>

        <b>Hours</b>
        월–금 10:00–17:00 (KST)
      </div>

      <form class="cform" id="cform" novalidate>
        <div class="cfield">
          <label for="f-name">이름</label>
          <input id="f-name" name="name" type="text" required autocomplete="name">
        </div>

        <div class="cfield">
          <label for="f-org">소속</label>
          <input id="f-org" name="org" type="text" autocomplete="organization">
        </div>

        <div class="cfield">
          <label for="f-email">이메일</label>
          <input id="f-email" name="email" type="email" required autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="cfield">
          <label for="f-who">소속 유형</label>
          <select id="f-who" name="who">
            <option>공공기관</option>
            <option>컬렉터 · 패밀리오피스</option>
            <option>갤러리 · 아트페어</option>
            <option>기업 · 재단</option>
            <option>개인</option>
            <option>기타</option>
          </select>
        </div>

        <div class="cfield wide">
          <label for="f-type">문의 유형</label>
          <select id="f-type" name="type">
            <option>시가감정 · 미술품 가치평가</option>
            <option>리서치 &amp; 공공 프로젝트</option>
            <option>프로그램 플랫폼</option>
            <option>VIP 커뮤니티</option>
            <option>기타</option>
          </select>
        </div>

        <div class="cfield wide">
          <label for="f-msg">내용</label>
          <textarea id="f-msg" name="message" required
            placeholder="목적, 대략의 시기와 규모를 함께 적어주세요."></textarea>
        </div>

        <div class="ctrap" aria-hidden="true">
          <label for="f-web">Leave this empty</label>
          <input id="f-web" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="cactions">
          <button class="send" type="submit" id="csend">보내기</button>
          <p class="cstatus" id="cstatus" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </div>
</section>
</main>

<footer class="se-footer">
  <div class="se-foot-in">
    <div>© SYR Edition</div>
  </div>
</footer>

<script>
/* ── 헤더 ─────────────────────────────────────────────────── */
(function(){
  var h=document.getElementById('seHeader'), b=document.getElementById('seBurger'),
      l=document.getElementById('seLang');
  if(b&&h){
    b.addEventListener('click',function(){
      var o=h.classList.toggle('open'); b.setAttribute('aria-expanded',String(o));
    });
    h.querySelectorAll('.se-nav a').forEach(function(a){
      a.addEventListener('click',function(){ h.classList.remove('open'); });
    });
  }
  /* 이중언어 텍스트가 붙기 전까지 언어 버튼은 숨깁니다 */
  if(l && typeof window.toggleLang !== 'function'){ l.style.display='none'; }
})();

/* ── 문의 폼 ───────────────────────────────────────────────────
   설정은 아래 두 줄뿐입니다.
   TO       : 받는 주소
   ENDPOINT : Formspree 주소. 비워두면 메일 앱이 열리는 방식으로
              자동 전환되어 지금 상태로도 바로 동작합니다.
              formspree.io 가입 → New Form → 받은 주소를 붙여넣기
   ──────────────────────────────────────────────────────────── */
(function(){
  var TO = 'info@syr.co.kr';
  var ENDPOINT = '';   // 예: 'https://formspree.io/f/xxxxxxxx'

  var form=document.getElementById('cform'),
      status=document.getElementById('cstatus'),
      button=document.getElementById('csend');

  function say(msg, cls){ status.textContent=msg; status.className='cstatus'+(cls?' '+cls:''); }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (form.website.value) return;                        // 봇 차단

    var name=form.name.value.trim(),
        email=form.email.value.trim(),
        message=form.message.value.trim();

    if(!name || !email || !message){ say('이름, 이메일, 내용을 채워주세요.','bad'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ say('이메일 주소를 다시 확인해주세요.','bad'); return; }

    var type = form.type.value, who = form.who.value;

    if(!ENDPOINT){
      var subject='[SYR Edition] '+type+' — '+name;
      var lines='이름: '+name+'\n'+
                '소속: '+(form.org.value.trim()||'-')+'\n'+
                '이메일: '+email+'\n'+
                '소속 유형: '+who+'\n'+
                '문의 유형: '+type+'\n\n'+
                '내용:\n'+message+'\n';
      window.location.href='mailto:'+TO+'?subject='+encodeURIComponent(subject)+
                           '&body='+encodeURIComponent(lines);
      say('전송을 눌러주세요.','ok');
      return;
    }

    button.disabled=true; say('보내는 중…');
    fetch(ENDPOINT,{method:'POST',headers:{'Accept':'application/json'},body:new FormData(form)})
      .then(function(res){
        if(!res.ok) throw new Error('failed');
        form.reset();
        say('보내주셔서 감사합니다. 곧 회신드리겠습니다.','ok');
      })
      .catch(function(){ say('시스템 업데이트 중입니다. info@syr.co.kr 로 직접 보내주시면 곧 회신드리겠습니다 :) ','bad'); })
      .then(function(){ button.disabled=false; });
  });
})();
</script>
</body>
</html>
